name: IndexNow

# Notify IndexNow search engines after each successful production deploy (Vercel reports
# deployments to GitHub). Can also be run by hand from the Actions tab.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  submit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
